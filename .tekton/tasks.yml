apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning the source checkout directory"
        rm -rf "$(workspaces.source.path)/repository"
        echo "Checkout directory cleanup complete"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.47.2
      script: |
        #!/bin/sh
        set -eu
        git clone --depth 1 --branch "$(params.revision)" "$(params.url)" "$(workspaces.source.path)/repository"
        git -C "$(workspaces.source.path)/repository" rev-parse --short HEAD
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/repository
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --disable-pip-version-check -r requirements.txt
        flake8 service tests
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/repository
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --disable-pip-version-check -r requirements.txt
        nosetests -v tests
