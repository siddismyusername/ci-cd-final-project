apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cicd-pipeline
spec:
  description: Lint, test, build and deploy the counter service to OpenShift.
  params:
    - name: repo-url
      type: string
      default: https://github.com/siddismyusername/cicd-final-project.git
    - name: revision
      type: string
      default: main
    - name: build-image
      type: string
      description: Internal registry image URL with namespace and tag.
  workspaces:
    - name: source
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: source

    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source

    - name: flake8
      runAfter: [git-clone]
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: source

    - name: nose
      runAfter: [flake8]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: source

    - name: buildah
      runAfter: [nose]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: DOCKERFILE
          value: repository/Dockerfile
        - name: CONTEXT
          value: repository
      workspaces:
        - name: source
          workspace: source

    - name: deploy
      runAfter: [buildah]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            set -eu
            oc create deployment cicd-app --image="$(params.build-image)" --dry-run=client -o yaml | oc apply -f -
            oc set image deployment/cicd-app cicd-app="$(params.build-image)"
            oc create service clusterip cicd-app --tcp=8000:8000 --dry-run=client -o yaml | oc apply -f -
            oc rollout status deployment/cicd-app --timeout=180s
            oc get deployment cicd-app
